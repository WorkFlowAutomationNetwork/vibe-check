<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Badge redesign mockup</title>
<style>
  body {
    background: #FAFAF7;
    font-family: system-ui, sans-serif;
    padding: 60px;
    display: flex;
    flex-direction: column;
    gap: 48px;
  }
  h2 { font-size: 14px; color: #54544F; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
  .label { font-family: monospace; font-size: 12px; color: #8A8A82; }
</style>
</head>
<body>

<div>
  <h2>Current badge (shields.io style)</h2>
  <div class="row">
    <svg xmlns="http://www.w3.org/2000/svg" width="126" height="20">
      <linearGradient id="s0" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
      </linearGradient>
      <clipPath id="r0"><rect width="126" height="20" rx="3" fill="#fff"/></clipPath>
      <g clip-path="url(#r0)">
        <rect width="90" height="20" fill="#0f0f0e"/>
        <rect x="90" width="36" height="20" fill="#dc2626"/>
        <rect width="126" height="20" fill="url(#s0)"/>
      </g>
      <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
        <text x="45" y="15" fill="#000" fill-opacity=".3">Vibe-Checked</text>
        <text x="45" y="14">Vibe-Checked</text>
        <text x="108" y="15" fill="#000" fill-opacity=".3">✓ D</text>
        <text x="108" y="14">✓ D</text>
      </g>
    </svg>
    <span class="label">← what it looks like today (active, grade D)</span>
  </div>
</div>

<div>
  <h2>Proposed redesign — active</h2>
  <div class="row">
    <!-- Grade A (green) -->
    <svg xmlns="http://www.w3.org/2000/svg" width="168" height="34" viewBox="0 0 168 34">
      <rect x="7" y="7" width="158" height="27" rx="13.5" fill="#0F0F0E"/>
      <rect x="4" y="4" width="158" height="27" rx="13.5" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="1.5"/>
      <circle cx="19" cy="17.5" r="11" fill="#7C3AED"/>
      <text x="19" y="22" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✓</text>
      <text x="38" y="22" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0E">Vibe-Checked</text>
      <text x="140" y="22" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="14" font-weight="800" fill="#16a34a">A</text>
    </svg>
    <span class="label">grade A</span>

    <!-- Grade D (orange/red) -->
    <svg xmlns="http://www.w3.org/2000/svg" width="168" height="34" viewBox="0 0 168 34">
      <rect x="7" y="7" width="158" height="27" rx="13.5" fill="#0F0F0E"/>
      <rect x="4" y="4" width="158" height="27" rx="13.5" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="1.5"/>
      <circle cx="19" cy="17.5" r="11" fill="#7C3AED"/>
      <text x="19" y="22" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✓</text>
      <text x="38" y="22" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0E">Vibe-Checked</text>
      <text x="140" y="22" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="14" font-weight="800" fill="#ea580c">D</text>
    </svg>
    <span class="label">grade D</span>
  </div>
</div>

<div>
  <h2>Proposed redesign — lapsed / expired</h2>
  <div class="row">
    <svg xmlns="http://www.w3.org/2000/svg" width="168" height="34" viewBox="0 0 168 34">
      <rect x="7" y="7" width="158" height="27" rx="13.5" fill="#B9B9B0"/>
      <rect x="4" y="4" width="158" height="27" rx="13.5" fill="#F2F2EC" stroke="#8A8A82" stroke-width="1.5"/>
      <circle cx="19" cy="17.5" r="11" fill="#8A8A82"/>
      <text x="19" y="22" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✓</text>
      <text x="38" y="22" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A8A82" text-decoration="line-through">Vibe-Checked</text>
    </svg>
    <span class="label">badge expired / lapsed</span>
  </div>
</div>

<div>
  <h2>On a mock page background (how it'd sit embedded)</h2>
  <div style="background:#fff; border:1px solid #E6E6DE; border-radius:4px; padding:40px; max-width:480px;">
    <div style="font-family:system-ui; font-weight:700; font-size:18px; margin-bottom:8px;">MyStartup.io</div>
    <div style="font-family:system-ui; font-size:13px; color:#54544F; margin-bottom:20px;">Built fast, shipped faster.</div>
    <svg xmlns="http://www.w3.org/2000/svg" width="168" height="34" viewBox="0 0 168 34">
      <rect x="7" y="7" width="158" height="27" rx="13.5" fill="#0F0F0E"/>
      <rect x="4" y="4" width="158" height="27" rx="13.5" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="1.5"/>
      <circle cx="19" cy="17.5" r="11" fill="#7C3AED"/>
      <text x="19" y="22" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✓</text>
      <text x="38" y="22" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0E">Vibe-Checked</text>
      <text x="140" y="22" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="14" font-weight="800" fill="#16a34a">A</text>
    </svg>
  </div>
</div>

</body>
</html>
